<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
/*
 * THE CUTOUT, so there is no vignette hack.
 *
 * These boards used to composite `hero-clean.png` — a white product on a
 * white seamless — and hide its edges with a wide radial mask plus an
 * overlay that darkened the surviving ring of backdrop. It worked, barely,
 * and it was two tricks stacked on a problem that should not exist.
 * `iriz-cutout.png` is the same render with the seamless keyed out
 * (design-src/cutout.mjs), so the product just drops onto the board.
 */
/*
 * REPLACES public/media/iriz/detail/11-apps-10000.png  (1014 x 1551)
 *
 * WHAT WAS WRONG WITH THE ORIGINAL. It was a photograph of a Google TV home
 * screen, carrying the Google TV wordmark and the Netflix, Disney+, Prime
 * Video, Spotify, YouTube and Google Play marks, over a grid of
 * AI-generated film posters with garbled titles ("UNLEAUS", "ARILISBAR V"),
 * around a projector whose shell is not the shell that ships. It was
 * headlined "Access to 10,000+ Apps" — a store-catalogue figure the retail
 * box does not print, over apps that are neither "official" nor
 * "pre-installed".
 *
 * WHAT THIS DRAWS INSTEAD. A generic launcher: unbranded tiles, a search
 * field, a row of placeholder artwork rendered as plain gradient cards. No
 * third-party mark anywhere, no title that could be mistaken for a real
 * film, and the projector is our own photograph from public/media.
 *
 * The claim it makes is the one the box supports: Android 14 is on the
 * device, so apps install onto the projector itself.
 *
 * Canvas and visual weight match the original exactly, so the three
 * surfaces that render it (GALLERY, HIGHLIGHT_BOARDS, and the mobile
 * carousel) need no layout change.
 */
html, body { width: 1014px; height: 1551px; overflow: hidden; }
body {
  background:
    radial-gradient(ellipse 80% 50% at 50% 18%, #1b2230 0%, #0b0e14 55%, #05070b 100%);
  position: relative;
}

.head {
  padding: 74px 64px 0;
  text-align: center;
}
.head h1 {
  font-size: 68px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.04;
}
.head h1 em { font-style: normal; color: var(--accent-soft); }
.head p {
  margin: 20px 0 0;
  font-size: 25px;
  line-height: 1.45;
  color: rgba(255,255,255,.62);
}

/* ---- The projected screen ---------------------------------------- */
.screen-wrap {
  margin: 54px 52px 0;
  position: relative;
}
/* The light spilling off a projected image onto the wall behind it. */
.screen-wrap::before {
  content: '';
  position: absolute;
  inset: -7% -5%;
  background: radial-gradient(ellipse 55% 55% at 50% 50%, rgba(120,170,255,.22), rgba(120,170,255,0) 70%);
  filter: blur(34px);
}
.screen {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 16 / 9.8;
  background: linear-gradient(170deg, #11151d 0%, #0a0d13 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 40px 90px -30px rgba(0,0,0,.9);
  padding: 26px 28px 30px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
/* The content shelf takes the remaining height, so the launcher fills its
   frame instead of leaving a dead band under the last row. */
.screen > div:last-child { display: flex; flex-direction: column; }

/* Launcher chrome: a clock, a search field, an avatar dot. Nothing named. */
.sys {
  display: flex;
  align-items: center;
  gap: 16px;
}
.sys .time { font-size: 17px; font-weight: 600; color: rgba(255,255,255,.75); }
.sys .find {
  flex: 1;
  height: 40px;
  border-radius: 999px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.10);
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 16px;
  font-size: 15px;
  color: rgba(255,255,255,.42);
}
.sys .find svg { width: 17px; height: 17px; }
.sys .me {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(140deg, #3b82f6, #1e40af);
}

.row-label {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .02em;
  color: rgba(255,255,255,.55);
}

/* App tiles — rounded squares with an abstract glyph, no wordmark. */
.apps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; }
.app {
  aspect-ratio: 1;
  border-radius: 17px;
  border: 1px solid rgba(255,255,255,.09);
  display: grid;
  place-items: center;
  color: rgba(255,255,255,.80);
}
.app svg { width: 42%; height: 42%; }
.a1 { background: linear-gradient(145deg,#2d3c5e,#1a2238); }
.a2 { background: linear-gradient(145deg,#3a3050,#211b31); }
.a3 { background: linear-gradient(145deg,#1f4452,#132b36); }
.a4 { background: linear-gradient(145deg,#4a3328,#2a1d16); }
.a5 { background: linear-gradient(145deg,#2a4636,#182a20); }
.a6 { background: linear-gradient(145deg,#423049,#271c2c); }
.a7 { background: linear-gradient(145deg,#2e3647,#1b212c); }

/* Content shelf — plain gradient cards. Deliberately no titles, no faces,
   no poster artwork: a placeholder that cannot be mistaken for a real
   release and needs no licence. */
.shelf { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
.tile {
  aspect-ratio: 16 / 10;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.07);
}
.t1 { background: linear-gradient(160deg,#2b3550,#141a28); }
.t2 { background: linear-gradient(160deg,#333050,#1a1826); }
.t3 { background: linear-gradient(160deg,#1f3f4a,#121f26); }
.t4 { background: linear-gradient(160deg,#3b3348,#1d1a24); }
.t5 { background: linear-gradient(160deg,#293a46,#141d24); }

/* ---- The unit ------------------------------------------------------ */
.unit {
  position: absolute;
  left: 50%;
  bottom: 86px;
  transform: translateX(-50%);
  width: 800px;
  height: 392px;
  overflow: hidden;
}
/*
 * CROPPED FIRST, THEN FEATHERED.
 *
 * hero-clean.png is a 1:1 render with the unit across its middle band and
 * white seamless above and below. A circular mask over the whole square is
 * therefore mostly backdrop, and on a dark ground that reads as a glowing
 * white orb with a projector inside it — which is what the first render of
 * this board looked like.
 *
 * `object-fit: cover` in a 700x330 box throws the empty bands away, so the
 * ellipse below is feathering the product's own edges rather than a field
 * of white.
 */
.unit img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.foot {
  position: absolute;
  left: 0; right: 0; bottom: 34px;
  text-align: center;
  font-size: 19px;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-weight: 600;
  color: rgba(255,255,255,.40);
}
</style>
</head>
<body>

<div class="head">
  <h1>Your apps. <em>Built in.</em></h1>
  <p>Android 14 on the projector itself — install what you watch over Wi-Fi.<br>No streaming stick, no second remote.</p>
</div>

<div class="screen-wrap">
  <div class="screen">
    <div class="sys">
      <span class="time">8:45</span>
      <span class="find">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        Search for apps
      </span>
      <span class="me"></span>
    </div>

    <div>
      <div class="row-label" style="margin-bottom:13px">Your apps</div>
      <div class="apps">
        <!-- Abstract glyphs only: a play mark, a music note, a grid, a cloud,
             a gamepad, a camera, a plus. None is a brand. -->
        <div class="app a1"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="app a2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></div>
        <div class="app a3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg></div>
        <div class="app a4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15a4 4 0 0 1 .9-7.9A5.5 5.5 0 0 1 16 7a4 4 0 0 1 .8 7.95"/><path d="M12 12v8M8.5 16.5 12 20l3.5-3.5"/></svg></div>
        <div class="app a5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="12" r="1.1" fill="currentColor"/><circle cx="18.5" cy="14" r="1.1" fill="currentColor"/></svg></div>
        <div class="app a6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></div>
        <div class="app a7"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6v12M6 12h12"/></svg></div>
      </div>
    </div>

    <div>
      <div class="row-label" style="margin-bottom:13px">Continue watching</div>
      <div class="shelf">
        <div class="tile t1"></div>
        <div class="tile t2"></div>
        <div class="tile t3"></div>
        <div class="tile t4"></div>
        <div class="tile t5"></div>
      </div>
    </div>
  </div>
</div>

<div class="unit"><img src="../../public/media/iriz/product/iriz-cutout.png" alt=""></div>
<div class="foot">Android 14 · Wi-Fi · 1080p</div>

</body>
</html>
